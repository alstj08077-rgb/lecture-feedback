<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사후 인지 확인</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>사후 인지 확인</h1>
      <p class="subtitle">설문에 응해주셔서 감사합니다. 마지막으로 몇 가지 추가 질문에 응답해 주시기 바랍니다.</p>
    </header>

    <main class="content">
      <form id="postForm">

        <section class="section">
          <div class="question">
            <label class="question-label">Q1. 방금 동의하신 약관에 포함된 내용은 무엇이었습니까? (복수 선택 가능)</label>
            <div class="options vertical">
              <label class="option"><input type="checkbox" name="postQ1" value="개인정보 수집"><span>개인정보 수집</span></label>
              <label class="option"><input type="checkbox" name="postQ1" value="연구 데이터 활용"><span>연구 데이터 활용</span></label>
              <label class="option"><input type="checkbox" name="postQ1" value="더보기 항목"><span>더보기 항목</span></label>
              <label class="option"><input type="checkbox" name="postQ1" value="기억나지 않음"><span>기억나지 않음</span></label>
            </div>
          </div>

          <div class="question">
            <label class="question-label">Q2. 약관(더보기)을 끝까지 읽으셨습니까?</label>
            <div class="options vertical">
              <label class="option"><input type="radio" name="postQ2" value="전부 읽었습니다"><span>예, 전부 읽었습니다</span></label>
              <label class="option"><input type="radio" name="postQ2" value="일부만 읽었습니다"><span>일부만 읽었습니다</span></label>
              <label class="option"><input type="radio" name="postQ2" value="읽지 않았습니다"><span>읽지 않았습니다</span></label>
            </div>
          </div>

          <div class="question">
            <label class="question-label">Q3. 이 설문이 어느 기관에서 진행한다고 느끼셨습니까?</label>
            <input type="text" name="postQ3" placeholder="떠오르는 기관명을 자유롭게 작성해 주세요">
          </div>

          <div class="question">
            <label class="question-label">Q4. 설문 진행 기관이 신뢰할 만하다고 느끼셨습니까? (1점: 전혀 신뢰하지 않음 ~ 5점: 매우 신뢰함)</label>
            <div class="options">
              <label class="option"><input type="radio" name="postQ4" value="1"><span>1점</span></label>
              <label class="option"><input type="radio" name="postQ4" value="2"><span>2점</span></label>
              <label class="option"><input type="radio" name="postQ4" value="3"><span>3점</span></label>
              <label class="option"><input type="radio" name="postQ4" value="4"><span>4점</span></label>
              <label class="option"><input type="radio" name="postQ4" value="5"><span>5점</span></label>
            </div>
          </div>

          <div class="question">
            <label class="question-label">Q5. 기관 명칭이 동의 결정에 영향을 미쳤습니까?</label>
            <div class="options vertical">
              <label class="option"><input type="radio" name="postQ5" value="크게 영향을 미쳤다"><span>크게 영향을 미쳤다</span></label>
              <label class="option"><input type="radio" name="postQ5" value="다소 영향을 미쳤다"><span>다소 영향을 미쳤다</span></label>
              <label class="option"><input type="radio" name="postQ5" value="보통이다"><span>보통이다</span></label>
              <label class="option"><input type="radio" name="postQ5" value="거의 영향을 미치지 않았다"><span>거의 영향을 미치지 않았다</span></label>
              <label class="option"><input type="radio" name="postQ5" value="전혀 영향을 미치지 않았다"><span>전혀 영향을 미치지 않았다</span></label>
            </div>
          </div>
        </section>

        <div class="submit-area">
          <button type="submit" class="btn-submit">다음</button>
        </div>

      </form>
    </main>
  </div>

  <script src="tracker.js"></script>
  <script>
    initTracker('B');

    document.getElementById('postForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = collectFormData(this);
      savePostAndProceed(formData, 'debrief.html');
    });
  </script>
</body>
</html>
