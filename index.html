<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설문 준비 중</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 40px 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e5e7eb;
      border-top-color: #1e3a5f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      color: #5a6270;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <main class="content">
      <div class="loader-wrap">
        <div class="spinner"></div>
        <p class="loader-text">설문지를 불러오는 중입니다...</p>
      </div>
    </main>
  </div>

  <script>
    // 기존 세션이 있으면 초기화 (새로운 참여자로 시작)
    sessionStorage.removeItem('trackerData');

    // A/B/C 그룹 랜덤 배정
    const groups = ['A', 'B', 'C'];
    const selectedGroup = groups[Math.floor(Math.random() * groups.length)];

    const pageMap = {
      'A': 'groupA.html',
      'B': 'groupB.html',
      'C': 'groupC.html'
    };

    // 자연스러움을 위해 0.5초 대기 후 이동
    setTimeout(() => {
      window.location.replace(pageMap[selectedGroup]);
    }, 500);
  </script>
</body>
</html>
